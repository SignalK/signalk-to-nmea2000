# Signal K's shared plugin CI: Linux (x64 and arm64), macOS and Windows on
# Node 22, 24 and 26, as Signal K Server needs Node 22 or later. It also
# checks the plugin's package, entry point, schema and lifecycle. See
# https://github.com/SignalK/signalk-server/blob/master/docs/develop/plugins/ci.md
#
# For now it runs by hand only (Actions tab, "Run workflow"): its App Store
# check fails on canboatjs's prebuilt native addon until
# SignalK/signalk-server#3281 is merged. main.yml runs the tests meanwhile.
# Once it is merged, restore the push and pull_request triggers below.

name: SignalK Plugin CI

on:
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      node-versions:
        description: 'JSON array of Node versions, e.g. ["22","24","26"]'
        required: false
        default: '["22", "24", "26"]'
        type: string
      enable-signalk-integration:
        description: Start a Signal K server and install the plugin
        required: false
        default: false
        type: boolean

jobs:
  test-plugin-auto:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      node-versions: '["22", "24", "26"]'

  test-plugin-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      node-versions: ${{ inputs.node-versions }}
      enable-signalk-integration: ${{ inputs.enable-signalk-integration }}
